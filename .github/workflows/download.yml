name: Telegram Video Downloader

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Video page URL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      # - name: Install FFmpeg (static)
      #   run: |
      #     sudo apt update
      #     sudo apt install -y wget xz-utils
      #     wget https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
      #     tar -xf ffmpeg-release-amd64-static.tar.xz
      #     sudo mv ffmpeg-*-static/ffmpeg /usr/local/bin/ffmpeg
      #     sudo mv ffmpeg-*-static/ffprobe /usr/local/bin/ffprobe
      #     ffmpeg -version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install playwright telethon requests
          playwright install chromium

      - name: Write link to file
        run: |
          echo "${{ inputs.link }}" > links.txt

      - name: Verify ffmpeg path
        run: |
          which ffmpeg
          ffmpeg -version    
      
      - name: Run downloader
        run: |
          python latest2.py

      - name: Debug videos folder
        run: |
          echo "Videos folder content:"
          ls -lh videos || echo "videos folder missing"       

      - name: Send video via Telethon
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python send_video.py
